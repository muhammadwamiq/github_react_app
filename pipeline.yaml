trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: EC2DeploymentVars  # your variable group containing AZURE_DEVOPS_TOKEN

steps:
- task: NodeTool@0
  displayName: 'Installing Node.js'
  inputs:
    versionSpec: '20.x'

- script: |
    npm install
    npm run build
  displayName: 'Installing dependencies and building project'

- task: CopyFiles@2
  displayName: 'Copying build to build artifact folder'
  inputs:
    contents: 'build/**'
    targetFolder: '$(Build.ArtifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  displayName: 'Publishing build artifact'
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'build'

# Run Semantic Release
- script: npx semantic-release
  env:
    AZURE_DEVOPS_TOKEN: $(AZURE_DEVOPS_TOKEN)
  displayName: 'Run Semantic Release'

# Extract version from Semantic Release dry run output
- script: |
    VERSION=$(npx semantic-release --dry-run | grep 'next release version' | awk '{print $NF}')
    echo "##vso[task.setvariable variable=RELEASE_VERSION]$VERSION"
  env:
    AZURE_DEVOPS_TOKEN: $(AZURE_DEVOPS_TOKEN)
  displayName: 'Extract Version'

# Copy files over SSH to your EC2 instance
- task: CopyFilesOverSSH@0
  displayName: 'Copying files to remote server and cleaning target folder'
  inputs:
    sshEndpoint: 'ec2-ssh-connection'
    sourceFolder: '$(Build.ArtifactStagingDirectory)/build'
    contents: '**'
    targetFolder: '/var/www/html'
    cleanTargetFolder: true

# Restart Nginx and export version info
- task: SSH@0
  displayName: 'Reloading Nginx and echoing release version'
  inputs:
    sshEndpoint: 'ec2-ssh-connection'
    runOptions: 'inline'
    inline: |
      sudo systemctl restart nginx
      export RELEASE_VERSION=$(RELEASE_VERSION)
      echo "Deploying version $RELEASE_VERSION"
